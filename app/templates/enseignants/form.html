{% extends "base.html" %}
{% block title %}Modifier enseignant · SchoolPro{% endblock %}
{% block content %}
<div class="page-head"><div><h2>Modifier l'enseignant</h2></div></div>
<div class="card" style="max-width:620px;">
  <form method="post">{{ csrf_field() }}
    <label>Nom complet</label><input name="nom" value="{{ en.nom }}" required>
    <label>Spécialité</label><input name="specialite" value="{{ en.specialite or '' }}">
    <label>Téléphone</label><input name="telephone" value="{{ en.telephone or '' }}">
    <label>Email</label><input name="email" type="email" value="{{ en.email or '' }}">
    <button class="btn btn-primary">Enregistrer</button>
    <a class="btn" href="{{ url_for('enseignants.liste') }}">Annuler</a>
  </form>
</div>
{% endblock %}
