{% extends "base.html" %}
{% block title %}{{ 'Modifier' if c else 'Nouvelle' }} classe · SchoolPro{% endblock %}
{% block content %}
<div class="page-head"><div><h2>{{ 'Modifier la classe' if c else 'Nouvelle classe' }}</h2></div></div>
<div class="card" style="max-width:640px;">
  <form method="post">{{ csrf_field() }}
    <div class="form-row">
      <div><label>Nom (ex: 6A)</label><input name="nom" value="{{ c.nom if c }}" required autofocus></div>
      <div><label>Niveau</label><input name="niveau" value="{{ c.niveau if c and c.niveau }}" placeholder="6ème année"></div>
    </div>
    <div class="form-row">
      <div><label>Frais annuels (DT)</label><input name="frais_annuels" type="number" step="0.01" min="0" value="{{ c.frais_annuels if c else 0 }}"></div>
      <div><label>Capacité (élèves max)</label><input name="capacite" type="number" min="1" value="{{ c.capacite if c else 30 }}"></div>
    </div>
    <button class="btn btn-primary">Enregistrer</button>
    <a class="btn" href="{{ url_for('classes.liste') }}">Annuler</a>
  </form>
</div>
{% endblock %}
